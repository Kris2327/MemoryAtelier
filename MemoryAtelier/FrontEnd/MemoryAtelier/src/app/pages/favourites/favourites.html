<div class="fav-page">
  <div class="fav-header">
    <button class="btn-back" (click)="goToHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      {{ i18n.t('common.backToShop') }}
    </button>
    <div class="fav-header-right">
      <h1 class="fav-title">{{ i18n.t('fav.title') }}</h1>
      <span class="fav-count">{{ items().length }} {{ i18n.t('common.products') }}</span>
    </div>
  </div>

  <div *ngIf="loading()" class="loading"><div class="spinner"></div></div>

  <div *ngIf="!loading() && items().length === 0" class="empty-state">
    <i class="bi bi-heart empty-icon"></i>
    <h3>{{ i18n.t('fav.emptyTitle') }}</h3>
    <p>{{ i18n.t('fav.emptySub') }}</p>
    <button class="btn-primary" (click)="goToHome()">{{ i18n.t('common.browseProducts') }}</button>
  </div>

  <div *ngIf="!loading() && items().length > 0" class="fav-grid">
    <div *ngFor="let item of items()" class="fav-card">
      <div class="fav-img-wrap">
        <img [src]="item.imageUrl || 'https://placehold.co/280x220'" [alt]="item.productName" class="fav-img" />
        <button class="btn-unfav" (click)="remove(item)" [title]="i18n.t('fav.removeTitle')"><i class="bi bi-heart-fill"></i></button>
      </div>
      <div class="fav-info">
        <h3 class="fav-name">{{ item.productName }}</h3>
        <div class="fav-footer">
          <span class="fav-price">€{{ item.price.toFixed(2) }}</span>
          <button class="btn-cart" (click)="addToCart(item)">{{ i18n.t('home.addToCart') }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
