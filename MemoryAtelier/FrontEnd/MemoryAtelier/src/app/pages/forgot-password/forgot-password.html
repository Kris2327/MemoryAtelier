<div class="auth-page">
  <div class="auth-left">
    <img src="roundedLogo.png" alt="" class="auth-deco-logo" />
    <h2 class="auth-tagline">{{ i18n.t('signin.tagline1') }}<br><em>{{ i18n.t('signin.tagline2') }}</em></h2>
  </div>

  <div class="auth-card">
    <button class="btn-back" (click)="goHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      {{ i18n.t('common.backToShop') }}
    </button>

    <div class="auth-brand">
      <span class="brand-logo">✿</span>
      <span class="brand-name">Memory Atelier</span>
    </div>
    <h2 class="auth-title">{{ i18n.t('forgotPassword.title') }}</h2>
    <p class="auth-sub">{{ i18n.t('forgotPassword.subtitle') }}</p>

    @if (submitted()) {
      <div class="info-msg">
        <i class="bi bi-envelope-check"></i> {{ i18n.t('forgotPassword.success') }}
      </div>
    } @else {
      <div class="form-group">
        <label>{{ i18n.t('forgotPassword.emailLabel') }}</label>
        <input type="email" [(ngModel)]="email" placeholder="you@example.com" class="input" (keydown.enter)="submit()" />
      </div>

      <button class="btn-submit" (click)="submit()" [disabled]="loading()">
        {{ loading() ? i18n.t('forgotPassword.submitting') : i18n.t('forgotPassword.submit') }}
      </button>
    }

    <p class="auth-switch">
      <a routerLink="/sign-in">{{ i18n.t('forgotPassword.backToSignIn') }}</a>
    </p>
  </div>
</div>
